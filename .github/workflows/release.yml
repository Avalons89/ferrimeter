name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/ferrimeter.exe ferrimeter.exe
          $hash = (Get-FileHash ferrimeter.exe -Algorithm SHA256).Hash.ToLower()
          # LF line ending so `sha256sum -c` works on Linux/macOS/Git Bash too.
          [IO.File]::WriteAllText("$PWD/ferrimeter.exe.sha256", "$hash  ferrimeter.exe`n")
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          ferrimeter.exe ferrimeter.exe.sha256
          --title "Ferrimeter ${{ github.ref_name }}"
          --generate-notes

  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --locked
      - name: Build (static)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          mkdir ferrimeter-linux-x86_64
          cp target/x86_64-unknown-linux-musl/release/ferrimeter packaging/linux/ferrimeter.desktop LICENSE ferrimeter-linux-x86_64/
          tar -czf ferrimeter-linux-x86_64.tar.gz ferrimeter-linux-x86_64
          sha256sum ferrimeter-linux-x86_64.tar.gz > ferrimeter-linux-x86_64.tar.gz.sha256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" ferrimeter-linux-x86_64.tar.gz ferrimeter-linux-x86_64.tar.gz.sha256
