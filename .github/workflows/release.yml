name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/ferrimeter.exe ferrimeter.exe
          $hash = (Get-FileHash ferrimeter.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ferrimeter.exe" | Out-File -Encoding ascii ferrimeter.exe.sha256
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          ferrimeter.exe ferrimeter.exe.sha256
          --title "Ferrimeter ${{ github.ref_name }}"
          --generate-notes
